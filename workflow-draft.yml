# DRAFT — NOT committed, NOT pushed (prepared 2026-11-23 for first run Tue 24 Nov 2026 19:00 PKT)
# Borewell Technology (@BorewellTechnology-m1t) daily loop live: one full playlist per day,
# 19:00–~00:15 PKT (5h13m of video, one GitHub Actions run, timeout 355 min).
#
# Adapted from cartoon-live-playlist-DRAFT.yml in ~/workspace/cartoon-live/
# (itself adapted from the committed cartoon-live.yml) and from
# live-score-cpt.yml in github.com/alikhan2728/cricket-live.
#
# KEY DIFFERENCE vs the cartoon workflow: the 12 borewell videos (~5-6 GB at 1080p)
# CANNOT be committed to the repo (GitHub rejects files >100 MB), so this workflow
# DOWNLOADS them fresh on the runner with yt-dlp at the start of each run, then
# streams the concat playlist. The playlist order file (playlist-day1.txt) IS
# committed to the repo; the videos are not.
#
# BEFORE FIRST RUN (all still open on 2026-11-23):
#   1. In YouTube Studio (Borewell Technology channel, joshangles221@gmail.com):
#      enable live streaming if not already enabled (first-time enablement can
#      take up to 24h to activate — check on 23 Nov, NOT on 24 Nov).
#   2. Create the broadcast in Studio: title e.g.
#      "🔴 LIVE: Borewell Drilling Marathon | Non-Stop Water Blast Videos",
#      Public, "Not made for kids", scheduled Tue 24 Nov 2026 19:00 PKT,
#      using the channel's stream key (auto-start ON so the push starts it).
#   3. Copy that stream key into the repo as a NEW secret named BOREWELL_YT_KEY
#      (Repo Settings → Secrets and variables → Actions). No such secret exists
#      today: the repo currently holds only CARTOON_YT_KEY, YT_RTMP and
#      CPT_SCOREBOARD_RTMP / CPT_SCOREBOARD_RTMP_2 (Cricket Pulse TV scoreboard).
#   4. Commit this file as .github/workflows/borewell-loop-live.yml in
#      alikhan2728/cricket-live, plus playlist-day1.txt (repo root or assets/).
#   5. Dispatch manually (Actions → Borewell Loop Live → Run workflow) with
#      duration_minutes=313 shortly before 19:00 PKT on 24 Nov, and verify in
#      Studio (health Good/Excellent) + on the public watch page before
#      telling Adnan it is live.
#
# DAILY ROTATION: the playlist order rotates so returning viewers see something
# different. Day 1 order is in playlist-day1.txt. For later days, pass a new
# comma-separated `order` (video numbers 1-12 as listed in playlist-day1.txt)
# or commit a playlist-dayN.txt and change the `playlist_file` input.
#
# VM NOTE: do NOT run this stream from the VM — VM egress blocks RTMP pushes.
# The push MUST come from the GitHub Actions runner, as here.

name: Borewell Loop Live

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Stream duration in minutes (313 = full 5h13m playlist, one pass)'
        required: false
        default: '313'
      playlist_file:
        description: 'ffmpeg concat playlist file in repo (play order; IDs taken from its filenames)'
        required: false
        default: 'playlist-day1.txt'
      order:
        description: 'Optional override: comma-separated video numbers 1-12 (replaces playlist_file order)'
        required: false
        default: ''

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -q yt-dlp

      - name: Download playlist videos
        run: |
          mkdir -p videos
          # playlist-day1.txt is an ffmpeg concat list; filenames are NN-<youtube-id>.mp4
          # where NN is the channel number (1-12, see README). Two ID lists:
          #   all-ids.txt  = IDs in play order (concat file order)
          #   chan-ids.txt = IDs in channel-number order (sorted by NN prefix)
          grep -oE "[0-9]{2}-[A-Za-z0-9_-]{11}\.mp4" "${{ inputs.playlist_file }}" | sed -E 's/^([0-9]{2})-([A-Za-z0-9_-]{11})\.mp4$/\1 \2/' > /tmp/nn-ids.txt
          awk '{print $2}' /tmp/nn-ids.txt > /tmp/all-ids.txt
          sort -n /tmp/nn-ids.txt | awk '{print $2}' > /tmp/chan-ids.txt
          if [ -n "${{ inputs.order }}" ]; then
            # order override: comma-separated CHANNEL numbers 1-12
            echo "${{ inputs.order }}" | tr ',' '\n' > /tmp/order.txt
            > /tmp/queue.txt
            while read -r n; do sed -n "${n}p" /tmp/chan-ids.txt >> /tmp/queue.txt; done < /tmp/order.txt
            QUEUE=/tmp/queue.txt
          else
            QUEUE=/tmp/all-ids.txt
          fi
          i=0
          while read -r vid; do
            [ -z "$vid" ] && continue
            i=$((i+1))
            echo "[$i] downloading $vid ..."
            if ! yt-dlp --no-update --retries 5 -f "bv*[height<=1080]+ba/b[height<=1080]" \
              --merge-output-format mp4 -o "videos/$(printf %02d $i)-${vid}.mp4" \
              "https://www.youtube.com/watch?v=${vid}"; then
              echo "WARN: default client failed for $vid — retrying with android client"
              if ! yt-dlp --no-update --retries 3 \
                --extractor-args "youtube:player_client=android" \
                -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 \
                -o "videos/$(printf %02d $i)-${vid}.mp4" \
                "https://www.youtube.com/watch?v=${vid}"; then
                echo "WARN: $vid could not be downloaded — it will be skipped from the playlist"
              fi
            fi
          done < "$QUEUE"
          ls -lh videos/

      - name: Build concat playlist + verify
        run: |
          rm -f playlist.txt
          # Play order = filename order (01..NN). A video whose download failed is
          # skipped (warned above) instead of failing the whole run.
          for f in videos/*.mp4; do
            [ -f "$f" ] || continue
            ffprobe -hide_banner -v error -show_entries stream=width,height,duration \
              -of default=noprint_wrappers=1 "$f" > /dev/null
            echo "file '$PWD/$f'" >> playlist.txt
            echo "queued: $f"
          done
          n=$(wc -l < playlist.txt)
          echo "PLAYLIST VIDEOS: $n"
          [ "$n" -gt 0 ] || { echo "ERROR: no videos downloaded — aborting"; exit 1; }
          echo "--- playlist.txt ---"; cat playlist.txt
          # total duration (seconds) of one pass
          python3 -c "
          import json, subprocess, glob
          total = 0.0
          for f in sorted(glob.glob('videos/*.mp4')):
              out = subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',f])
              total += float(json.loads(out)['format']['duration'])
          print(f'PLAYLIST TOTAL: {total:.0f}s = {total/60:.1f} min')"

      - name: Stream playlist to YouTube (loop)
        env:
          YT_KEY: ${{ secrets.BOREWELL_YT_KEY }}
        run: |
          SECONDS=$(( ${{ inputs.duration_minutes }} * 60 ))
          echo "Streaming Borewell playlist for ${SECONDS}s..."
          ffmpeg -hide_banner -loglevel warning \
            -re -stream_loop -1 -f concat -safe 0 -i playlist.txt \
            -t "$SECONDS" \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30" \
            -c:v libx264 -preset veryfast -b:v 2500k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 60 -r 30 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_KEY"
          echo "Stream finished."
