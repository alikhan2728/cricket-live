name: CPT Scoreboard Stream

# Cricket Pulse TV automated scoreboard — manual trigger with Cricbuzz URL.
# Streams to the "Scoreboard" stream key (CPT_SCOREBOARD_RTMP secret),
# or to the "Scoreboard 2" stream key (CPT_SCOREBOARD_RTMP_2 secret) when key_choice=second.
# Runs up to ~5h45m (GitHub's 6-hour job limit), then stops cleanly.
on:
  workflow_dispatch:
    inputs:
      cricbuzz_url:
        description: "Cricbuzz live-scores page URL"
        required: true
      match_title:
        description: "(Optional — auto-detected from Cricbuzz)"
        required: false
        default: ""
      subtitle:
        description: "(Optional — auto-detected from Cricbuzz)"
        required: false
        default: ""
      key_choice:
        description: "Stream key: 'main' or 'second'"
        required: false
        default: "main"
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests pillow edge-tts

      - name: Stream to YouTube (Cricket Pulse TV)
        env:
          RTMP_MAIN: ${{ secrets.CPT_SCOREBOARD_RTMP }}
          RTMP_2: ${{ secrets.CPT_SCOREBOARD_RTMP_2 }}
        run: >
          if [ "${{ inputs.key_choice }}" = "second" ]; then RTMP="$RTMP_2"; else RTMP="$RTMP_MAIN"; fi;
          python stream_anim.py
          --cricbuzz-url "${{ inputs.cricbuzz_url }}"
          --rtmp "$RTMP"
